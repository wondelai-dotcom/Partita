name: Release readiness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "release/**", "security/**"]

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static and configuration checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate release configuration and syntax
        run: |
          node --version
          node scripts/validate-release.js
